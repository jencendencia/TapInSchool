appId: com.tapin.school
productName: TapIn School
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
# Native serialport bindings must stay unpacked to be loadable from the packaged app.
asarUnpack:
  - "**/*.node"
  - node_modules/serialport/**
  - node_modules/@serialport/**
win:
  # App (taskbar/desktop/installer) icon — 1024x1024 PNG, converted to .ico
  # during packaging. Separate from the school logo in Settings.
  icon: JE_logo.png
  target:
    - nsis
# Auto-update endpoint (P0-3.8). electron-updater checks GitHub releases for
# new builds and installs them on quit. The latest.yml uploaded to each release
# must reference the dotted asset filename (TapIn.School.Setup.X.X.X.exe) so the
# auto-updater can resolve the download URL without a 404.
publish:
  provider: github
  owner: jencendencia
  repo: TapInSchool
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
npmRebuild: true
